# After a merge into main, rebuilds index.json (the list the app reads).
name: Build index

on:
  push:
    branches: [main]
    paths: ['packages/**', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/hub.mjs index
      - name: Commit index.json if it changed
        run: |
          if git diff --quiet -- index.json; then echo "index.json unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Update index.json"
          git push
